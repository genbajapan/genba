<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f2e"/>
      <stop offset="1" stop-color="#123b51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#071f2e" flood-opacity="0.10"/>
    </filter>
    <style>
      .jp { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
      .navy { fill: #0b2638; }
      .muted { fill: #58707d; }
      .label { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; }
      .company { font-size: 43px; font-weight: 900; letter-spacing: -0.025em; }
      .category { font-size: 24px; font-weight: 750; }
      .row-label { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
      .body { font-size: 29px; font-weight: 750; }
      .small { font-size: 21px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="#f4f7f6"/>
  <rect width="1200" height="390" fill="url(#header)"/>
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M70 0V390M140 0V390M210 0V390M280 0V390M350 0V390M420 0V390M490 0V390M560 0V390M630 0V390M700 0V390M770 0V390M840 0V390M910 0V390M980 0V390M1050 0V390M1120 0V390"/>
  </g>

  <g class="jp">
    <rect x="72" y="58" width="264" height="54" rx="27" fill="#70d3c5"/>
    <text x="204" y="95" text-anchor="middle" class="label navy">GENBA 二択 #01</text>
    <text x="72" y="194" fill="#ffffff" font-size="58" font-weight="900" letter-spacing="-0.04em">製造業を変えるなら、</text>
    <text x="72" y="274" fill="#ffffff" font-size="66" font-weight="900" letter-spacing="-0.04em">計画か、設計か。</text>
    <text x="74" y="339" fill="#c8dedb" font-size="25" font-weight="650">知られていない2社から、売る課題の違いを見る。</text>

    <g filter="url(#shadow)">
      <rect x="54" y="356" width="1092" height="1016" rx="18" fill="#ffffff"/>
    </g>

    <line x1="600" y1="425" x2="600" y2="1300" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="422" width="58" height="58" rx="29" fill="#0b7a70"/>
    <text x="120" y="462" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="900">A</text>
    <text x="174" y="459" class="company navy">Gurobi</text>
    <text x="91" y="512" class="category muted">Mathematical Optimization</text>

    <rect x="637" y="422" width="58" height="58" rx="29" fill="#123b51"/>
    <text x="666" y="462" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="900">B</text>
    <text x="720" y="459" class="company navy">Neural Concept</text>
    <text x="637" y="512" class="category muted">Engineering AI</text>

    <rect x="91" y="578" width="455" height="54" rx="7" fill="#e3f4f1"/>
    <text x="116" y="614" class="row-label" fill="#08685f">変える意思決定</text>
    <text x="91" y="687" class="body navy">どの計画を選ぶか</text>
    <text x="91" y="734" class="small muted">生産・物流・配分・schedule</text>

    <rect x="637" y="578" width="455" height="54" rx="7" fill="#e9eef1"/>
    <text x="662" y="614" class="row-label" fill="#123b51">変える意思決定</text>
    <text x="637" y="687" class="body navy">どの設計案を残すか</text>
    <text x="637" y="734" class="small muted">CAD・CAE・simulation</text>

    <line x1="91" y1="793" x2="546" y2="793" stroke="#d9e3e1" stroke-width="2"/>
    <line x1="637" y1="793" x2="1092" y2="793" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="832" width="455" height="54" rx="7" fill="#e3f4f1"/>
    <text x="116" y="868" class="row-label" fill="#08685f">顧客内の入口</text>
    <text x="91" y="940" class="body navy">business・operations</text>
    <text x="91" y="986" class="small muted">technical stakeholderも横断</text>

    <rect x="637" y="832" width="455" height="54" rx="7" fill="#e9eef1"/>
    <text x="662" y="868" class="row-label" fill="#123b51">顧客内の入口</text>
    <text x="637" y="940" class="body navy">engineering・data</text>
    <text x="637" y="986" class="small muted">IT・cloud teamも横断</text>

    <line x1="91" y1="1045" x2="546" y2="1045" stroke="#d9e3e1" stroke-width="2"/>
    <line x1="637" y1="1045" x2="1092" y2="1045" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="1084" width="455" height="54" rx="7" fill="#0b2638"/>
    <text x="116" y="1120" class="row-label" fill="#70d3c5">GENBA分析</text>
    <text x="91" y="1192" class="body navy">制約下の「選択」を売る</text>
    <text x="91" y="1238" class="small muted">cost・収益・資源利用</text>

    <rect x="637" y="1084" width="455" height="54" rx="7" fill="#0b2638"/>
    <text x="662" y="1120" class="row-label" fill="#70d3c5">GENBA分析</text>
    <text x="637" y="1192" class="body navy">設計の「探索」を売る</text>
    <text x="637" y="1238" class="small muted">試行回数・iteration速度</text>

    <text x="600" y="1420" text-anchor="middle" class="navy" font-size="37" font-weight="900">あなたなら、どちらの課題を売りたい？</text>
    <text x="600" y="1465" text-anchor="middle" class="muted" font-size="21" font-weight="650">両社とも日本のRegional Sales Directorを募集中</text>
  </g>
</svg>
