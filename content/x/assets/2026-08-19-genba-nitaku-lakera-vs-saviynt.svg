<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f2e"/>
      <stop offset="1" stop-color="#123b51"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#071f2e" flood-opacity="0.10"/>
    </filter>
    <style>
      .jp { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
      .navy { fill: #0b2638; }
      .muted { fill: #58707d; }
      .label { font-size: 24px; font-weight: 800; letter-spacing: 0.08em; }
      .company { font-size: 52px; font-weight: 900; letter-spacing: -0.025em; }
      .category { font-size: 24px; font-weight: 750; }
      .row-label { font-size: 22px; font-weight: 800; letter-spacing: 0.04em; }
      .body { font-size: 28px; font-weight: 750; }
      .small { font-size: 21px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="#f4f7f6"/>
  <rect width="1200" height="410" fill="url(#header)"/>
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M70 0V410M140 0V410M210 0V410M280 0V410M350 0V410M420 0V410M490 0V410M560 0V410M630 0V410M700 0V410M770 0V410M840 0V410M910 0V410M980 0V410M1050 0V410M1120 0V410"/>
  </g>

  <g class="jp">
    <rect x="72" y="58" width="264" height="54" rx="27" fill="#70d3c5"/>
    <text x="204" y="95" text-anchor="middle" class="label navy">GENBA 二択 #01</text>
    <text x="72" y="190" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-0.04em">AIエージェント事故。</text>
    <text x="72" y="270" fill="#ffffff" font-size="62" font-weight="900" letter-spacing="-0.04em">守るのは会話か、権限か。</text>
    <text x="74" y="340" fill="#c8dedb" font-size="25" font-weight="650">AIが騙されるriskと、AIに権限を与えすぎるrisk。</text>

    <g filter="url(#shadow)">
      <rect x="54" y="376" width="1092" height="998" rx="18" fill="#ffffff"/>
    </g>
    <line x1="600" y1="440" x2="600" y2="1300" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="438" width="58" height="58" rx="29" fill="#0b7a70"/>
    <text x="120" y="478" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="900">A</text>
    <text x="174" y="476" class="company navy">Lakera</text>
    <text x="91" y="527" class="category muted">AI Runtime Guardrails</text>

    <rect x="637" y="438" width="58" height="58" rx="29" fill="#123b51"/>
    <text x="666" y="478" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="900">B</text>
    <text x="720" y="476" class="company navy">Saviynt</text>
    <text x="637" y="527" class="category muted">AI Identity Security</text>

    <rect x="91" y="592" width="455" height="54" rx="7" fill="#e3f4f1"/>
    <text x="116" y="628" class="row-label" fill="#08685f">防ぐ事故</text>
    <text x="91" y="701" class="body navy">AIが悪意ある指示に</text>
    <text x="91" y="747" class="body navy">騙される</text>

    <rect x="637" y="592" width="455" height="54" rx="7" fill="#e9eef1"/>
    <text x="662" y="628" class="row-label" fill="#123b51">防ぐ事故</text>
    <text x="637" y="701" class="body navy">AIに広すぎる権限を</text>
    <text x="637" y="747" class="body navy">与えてしまう</text>

    <line x1="91" y1="805" x2="546" y2="805" stroke="#d9e3e1" stroke-width="2"/>
    <line x1="637" y1="805" x2="1092" y2="805" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="844" width="455" height="54" rx="7" fill="#e3f4f1"/>
    <text x="116" y="880" class="row-label" fill="#08685f">control point</text>
    <text x="91" y="952" class="body navy">input・reference・output</text>
    <text x="91" y="998" class="small muted">prompt・tool responseを検査</text>

    <rect x="637" y="844" width="455" height="54" rx="7" fill="#e9eef1"/>
    <text x="662" y="880" class="row-label" fill="#123b51">control point</text>
    <text x="637" y="952" class="body navy">identity・access・action</text>
    <text x="637" y="998" class="small muted">owner・権限・life cycleを管理</text>

    <line x1="91" y1="1057" x2="546" y2="1057" stroke="#d9e3e1" stroke-width="2"/>
    <line x1="637" y1="1057" x2="1092" y2="1057" stroke="#d9e3e1" stroke-width="2"/>

    <rect x="91" y="1096" width="455" height="54" rx="7" fill="#0b2638"/>
    <text x="116" y="1132" class="row-label" fill="#70d3c5">売る問い</text>
    <text x="91" y="1204" class="body navy">何を読んで、何を返して</text>
    <text x="91" y="1250" class="body navy">よいか？</text>

    <rect x="637" y="1096" width="455" height="54" rx="7" fill="#0b2638"/>
    <text x="662" y="1132" class="row-label" fill="#70d3c5">売る問い</text>
    <text x="637" y="1204" class="body navy">誰の代わりに、何をして</text>
    <text x="637" y="1250" class="body navy">よいか？</text>

    <text x="600" y="1420" text-anchor="middle" class="navy" font-size="38" font-weight="900">あなたなら、どちらのriskを提案する？</text>
    <text x="600" y="1465" text-anchor="middle" class="muted" font-size="21" font-weight="650">両社とも日本向けEnterprise Salesを募集中</text>
  </g>
</svg>
